name: Deploy voice server to Modal

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check secrets and read the Modal token
        # Accepts the bare values, or the whole "modal token set --token-id ak-... --token-secret as-..." line.
        env:
          RAW_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SAWTI_PASSWORD: ${{ secrets.SAWTI_PASSWORD }}
        run: |
          missing=""
          [ -z "$RAW_ID" ] && missing="$missing MODAL_TOKEN_ID"
          [ -z "$RAW_SECRET" ] && missing="$missing MODAL_TOKEN_SECRET"
          [ -z "$SAWTI_PASSWORD" ] && missing="$missing SAWTI_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          id=$(printf '%s %s' "$RAW_ID" "$RAW_SECRET" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)
          secret=$(printf '%s %s' "$RAW_SECRET" "$RAW_ID" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)
          if [ -z "$id" ]; then echo "::error::MODAL_TOKEN_ID must contain the token id that starts with ak-"; exit 1; fi
          if [ -z "$secret" ]; then echo "::error::MODAL_TOKEN_SECRET must contain the token secret that starts with as-"; exit 1; fi
          echo "::add-mask::$id"
          echo "::add-mask::$secret"
          echo "Token id: ak-... (${#id} chars), token secret: as-... (${#secret} chars)"
          echo "MODAL_TOKEN_ID=$id" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Install Modal
        run: pip install "modal>=1.0,<2"

      - name: Store the site password in Modal
        env:
          SAWTI_PASSWORD: ${{ secrets.SAWTI_PASSWORD }}
        run: modal secret create sawti-auth SAWTI_PASSWORD="$SAWTI_PASSWORD" --force

      - name: Deploy
        run: modal deploy server/app.py

      - name: Health check
        run: |
          url="https://${{ github.repository_owner }}--sawti.modal.run/health"
          echo "Server URL: https://${{ github.repository_owner }}--sawti.modal.run"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "$url"; then echo; echo "Server is up"; exit 0; fi
            sleep 10
          done
          echo "::warning::Deployed, but /health did not answer yet (first start can take a few minutes)."
