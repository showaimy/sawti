name: Deploy voice server to Modal

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only to publish the voice samples to their own branch
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check secrets and read the Modal token
        # Accepts the bare values, or the whole "modal token set --token-id ak-... --token-secret as-..." line.
        env:
          RAW_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SAWTI_PASSWORD: ${{ secrets.SAWTI_PASSWORD }}
        run: |
          missing=""
          [ -z "$RAW_ID" ] && missing="$missing MODAL_TOKEN_ID"
          [ -z "$RAW_SECRET" ] && missing="$missing MODAL_TOKEN_SECRET"
          [ -z "$SAWTI_PASSWORD" ] && missing="$missing SAWTI_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          id=$(printf '%s %s' "$RAW_ID" "$RAW_SECRET" | grep -oE 'ak-[A-Za-z0-9]+' | head -n1)
          secret=$(printf '%s %s' "$RAW_SECRET" "$RAW_ID" | grep -oE 'as-[A-Za-z0-9]+' | head -n1)
          if [ -z "$id" ]; then echo "::error::MODAL_TOKEN_ID must contain the token id that starts with ak-"; exit 1; fi
          if [ -z "$secret" ]; then echo "::error::MODAL_TOKEN_SECRET must contain the token secret that starts with as-"; exit 1; fi
          echo "::add-mask::$id"
          echo "::add-mask::$secret"
          echo "Token id: ak-... (${#id} chars), token secret: as-... (${#secret} chars)"
          echo "MODAL_TOKEN_ID=$id" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Install Modal
        run: pip install "modal>=1.0,<2"

      - name: Store the site password in Modal
        env:
          SAWTI_PASSWORD: ${{ secrets.SAWTI_PASSWORD }}
        run: modal secret create sawti-auth SAWTI_PASSWORD="$SAWTI_PASSWORD" --force

      - name: Deploy
        run: modal deploy server/app.py

      - name: Health check
        run: |
          base="https://${{ github.repository_owner }}--sawti.us-east.modal.run"
          url="$base/health"
          echo "Server URL: $base"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "$url"; then echo; echo "Server is up"; exit 0; fi
            sleep 10
          done
          echo "::warning::Deployed, but /health did not answer yet (first start can take a few minutes)."

      - name: Voice samples (one per engine, plus what Whisper hears)
        continue-on-error: true
        run: |
          mkdir -p samples
          python - <<'PY'
          import time
          import modal

          for attempt in range(6):
              try:
                  results = modal.Cls.from_name("sawti-tts", "TTS")().selftest.remote()
                  break
              except Exception as e:  # the previous version may still be answering right after a deploy
                  print("not ready yet:", type(e).__name__, str(e)[:200])
                  time.sleep(60)
          else:
              raise SystemExit("self-test did not run")
          for r in results:
              if r.get("wav"):
                  open(f"samples/{r['name']}.wav", "wb").write(r["wav"])
                  print(f"{r['name']}: {r['seconds']} s | heard: {r['heard']}")
              else:
                  print(f"{r['name']}: FAILED {r.get('error')}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-samples
          path: samples/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish the samples to the voice-samples branch
        if: always()
        continue-on-error: true
        run: |
          [ -n "$(ls samples 2>/dev/null)" ] || exit 0
          cd samples
          git init -q -b voice-samples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Voice samples from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-samples
